imagePullSecrets:
  - name: regcred

route:
  enabled: true
  host: tipimi.fr # TODO: confirm once the prod namespace/ArgoCD app exist
  extraHosts:
  - tipimi-ebs.lt-mut-prod-scw.les-tilleuls.solutions

# Matches create_cnpg_backup = true on the "tipimi-ebs" namespace in opentofu-scaleway-infra-mut.
cnpg:
  monitoring:
    podMonitor:
      enabled: true
  backup:
    enabled: true
    workspace: prod

meilisearch:
  persistence:
    enabled: true
    storageClass: "sbs-default"
    size: "1Gi"

redis:
  persistence:
    enabled: true
    storageClass: "sbs-default"
    size: "1Gi"

php:
  fixtureJob:
    enabled: false
  fixtureCron:
    enabled: false
